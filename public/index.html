<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<title>Museo del CM</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Concepto: mismo mundo que Panel Suárez y Mis finanzas (fondo casi negro, tarjetas de 24px con degradé, etiquetas diminutas en mayúsculas). Acento propio: celeste. Arriba, un perchero de madera con las camisetas colgadas en orden de llegada. */
:root{
  --bg:#07080b; --bg2:#10121a; --bg3:#161a22; --line:#22262f; --line2:#313642;
  --fg:#fafafa; --mut:#a3a8b4; --dim:#6b707c;
  --acc:#5bc8ff; --acc-ink:#03141f; --acc-soft:rgba(91,200,255,.14); --acc-line:rgba(91,200,255,.5); --ice:#d6f1ff;
  --wood1:#8a5a33; --wood2:#5e3a1f; --rod:#c9ced6;
  --red:#f87171;
  --disp:"Space Grotesk",Inter,system-ui,sans-serif; --body:Inter,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);background-image:radial-gradient(1200px 600px at 12% -10%,rgba(91,200,255,.10),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(214,241,255,.05),transparent 60%);background-repeat:no-repeat;color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;border-radius:12px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font:700 15px var(--disp);letter-spacing:-.02em;box-shadow:0 0 28px rgba(91,200,255,.35)}
.brand{font:600 20px var(--disp);letter-spacing:-.02em}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.tab{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 8px;border-radius:12px;color:var(--mut);font-size:13px;font-weight:500;transition:background .15s,color .15s}
.tab svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab:hover{color:var(--fg);background:rgba(255,255,255,.04)}
.tab[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);font-weight:600}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:20px}
.card{background:linear-gradient(to bottom right,var(--bg3),var(--bg2) 55%,var(--bg));border:1px solid var(--line);border-radius:24px;padding:24px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card.flush .card-h{padding:22px 24px 18px}
.lbl{font:600 10px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.h2{margin:8px 0 0;font:600 22px/1.15 var(--disp);letter-spacing:-.02em;text-wrap:balance}
.h2 em{font-style:normal;color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line2);background:rgba(16,18,26,.75);font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.pill.acc{background:var(--acc-soft);border-color:var(--acc-line);color:var(--ice)}
.pill.todo{border-style:dashed;color:var(--mut)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--acc);color:var(--acc-ink);font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--mut)}
.btn.danger{background:rgba(248,113,113,.14);color:#fecaca;border:1px solid rgba(248,113,113,.45)}
.btn[disabled]{opacity:.45;pointer-events:none}
.sel{padding:8px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);color:var(--mut);font-size:12px}
.flag{width:18px;height:12px;object-fit:cover;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.18);flex:none;display:inline-block;vertical-align:middle}
.crest{width:22px;height:22px;object-fit:contain;flex:none}

/* perchero */
.rack-card{padding:22px 0 0;overflow:hidden}
.rack-card .card-h{padding:0 24px}
.rack-wrap{position:relative;margin-top:18px}
.shelf{height:16px;margin:0 12px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--wood1),var(--wood2));box-shadow:0 8px 18px rgba(0,0,0,.5)}
.rack{position:relative;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;padding:0 24px 8px;cursor:grab}
.rack.drag{cursor:grabbing}
.rail{position:relative;display:flex;align-items:flex-start;width:max-content;padding:30px 40px 22px 10px}
.rail::before{content:"";position:absolute;left:0;right:0;top:22px;height:5px;border-radius:3px;background:linear-gradient(180deg,#eef1f5,var(--rod) 50%,#8d939c);box-shadow:0 2px 4px rgba(0,0,0,.5)}
.hang{all:unset;position:relative;flex:none;width:128px;margin-right:-70px;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .18s ease;transform-origin:50% 0}
.hang:hover,.hang:focus-visible,.hang.on{transform:translateY(-6px) scale(1.06);z-index:5}
.hang:focus-visible{outline:none}
.hang:focus-visible .flip{outline:2px solid var(--ice);outline-offset:2px;border-radius:8px}
.flip{perspective:700px;max-width:100%}
.flip-in{position:relative;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip-in>svg{display:block;width:100%;height:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-in>svg.back{position:absolute;inset:0;transform:rotateY(180deg)}
.hang:hover .flip-in,.hang:focus-visible .flip-in,.piece:hover .flip-in,.piece:focus-visible .flip-in,.flip.on .flip-in{transform:rotateY(180deg)}
@media (hover:none){.piece:hover .flip-in,.hang:hover .flip-in{transform:none}}
.hook{width:24px;height:32px;margin-top:-14px;margin-bottom:-9px;z-index:1}
.hook path{fill:none;stroke:#c9ced6;stroke-width:2.2;stroke-linecap:round}
.hang .flip{width:128px;filter:drop-shadow(-6px 4px 6px rgba(0,0,0,.55))}
.rack-cap{display:flex;align-items:center;gap:10px;min-height:52px;padding:10px 24px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.rack-cap .no{font:600 11px var(--body);letter-spacing:.14em;color:var(--acc);font-variant-numeric:tabular-nums}
.rack-cap b{font:600 15px var(--disp);display:inline-flex;align-items:center;gap:6px}
.rack-cap span.p{color:var(--mut);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.rack-cap .hint{color:var(--dim);font-size:12px}

/* estadísticas como filtros */
.full{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 22px;align-items:center;padding:18px 22px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(to bottom right,rgba(91,200,255,.12),var(--bg2));transition:border-color .15s}
.full:hover{border-color:var(--mut)}
.full[aria-pressed="true"]{border-color:var(--acc)}
.full .big{grid-row:1/3;font:700 clamp(2.2rem,5vw,3rem)/1 var(--disp);letter-spacing:-.035em;font-variant-numeric:tabular-nums;color:var(--acc)}
.full .big small{font-size:.45em;color:var(--mut);letter-spacing:0;margin-left:4px}
.full .t{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.full .t b{font:600 16px var(--disp)}
.full .t span{color:var(--mut);font-size:12px}
.full .bar{height:10px}
.tick{width:26px;height:26px;border-radius:50%;background:var(--acc);display:grid;place-items:center;box-shadow:0 0 14px rgba(91,200,255,.45)}
.tick svg{width:15px;height:15px;fill:none;stroke:var(--acc-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.piece.inc{opacity:.42;filter:saturate(.6)}
.piece.inc:hover,.piece.inc:focus-visible{opacity:1;filter:none}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.stat{all:unset;box-sizing:border-box;cursor:pointer;padding:16px 18px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(to bottom right,var(--bg3),var(--bg2));display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .15s,background .15s}
.stat:hover{border-color:var(--mut)}
.stat .v{font:700 clamp(1.7rem,3.6vw,2.4rem)/1 var(--disp);letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.stat .n{color:var(--mut);font-size:12px}
.stat[aria-pressed="true"]{border-color:var(--acc);background:linear-gradient(to bottom right,rgba(91,200,255,.16),var(--bg2))}
.stat[aria-pressed="true"] .v{color:var(--acc)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 24px 18px}
.q{margin-left:auto;min-width:0;width:min(100%,16rem);padding:9px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);font-size:12px}
.q::placeholder{color:var(--dim)}

/* grilla */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,12.5rem),1fr));gap:14px;padding:0 24px 24px}
.piece{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;border-radius:20px;border:1px solid var(--line);background:var(--bg);overflow:hidden;transition:border-color .15s,transform .15s}
.piece:hover{border-color:var(--acc-line);transform:translateY(-2px)}
.stage{position:relative;aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 40%,#1b1f29,#0b0c11)}
.stage img.photo{width:100%;height:100%;object-fit:cover}
.stage .flip{width:66%;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.stage .no{position:absolute;left:12px;top:12px;font:600 10px/1 var(--body);letter-spacing:.14em;color:var(--mut);background:rgba(7,8,11,.75);padding:6px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.stage .tags{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.piece .info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;min-width:0}
.club{display:flex;align-items:center;gap:7px;min-width:0}
.club b{font:600 15px/1.2 var(--disp);letter-spacing:-.01em;overflow-wrap:anywhere}
.piece .s{color:var(--mut);font-size:12px}
.piece .g{color:var(--fg);font-size:12.5px;display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.empty{padding:28px 24px;color:var(--mut);display:flex;flex-direction:column;gap:14px;align-items:flex-start}

/* grupos */
.group{border-top:1px solid var(--line);padding:16px 24px;display:flex;flex-direction:column;gap:12px}
.group-h{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.group-h .t{display:flex;align-items:center;gap:8px;font:600 17px var(--disp);letter-spacing:-.01em;min-width:0}
.group-h small{color:var(--mut);font-size:12px;white-space:nowrap}
.group-h small b{color:var(--fg);font:700 15px var(--disp)}
.minis{display:flex;flex-wrap:wrap;gap:8px}
.mini{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;max-width:100%}
.mini:hover{border-color:var(--acc-line)}
.mini svg.shirt{width:34px;height:34px}
.mini span{overflow-wrap:anywhere}
.mini em{font-style:normal;color:var(--dim)}

/* estadísticas */
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,24rem),1fr));gap:20px;align-items:start}
.bars{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.brow{display:flex;flex-direction:column;gap:6px}
.brow-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.brow-h span{display:inline-flex;align-items:center;gap:7px;min-width:0;overflow-wrap:anywhere}
.brow-h small{color:var(--fg);font:700 14px var(--disp);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:#1b1e26;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2aa9ee,#a6e2ff)}
.prog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.prog div{display:flex;flex-direction:column;gap:6px}
.prog b{font:700 26px/1 var(--disp);font-variant-numeric:tabular-nums}

/* formulario */
form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 18px;margin-top:20px}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>label,.fld>.lbl{font:600 10px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.inp{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--fg);font-size:14px}
textarea.inp{min-height:80px;resize:vertical}
.inp:focus{border-color:var(--acc);outline:none}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 13px;border-radius:999px;border:1px solid var(--line2);color:var(--mut);font-size:12.5px}
.seg button:hover{color:var(--fg);border-color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
.designer{grid-column:1/-1;display:grid;grid-template-columns:140px minmax(0,1fr);gap:20px;align-items:center;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--bg)}
.designer .prev{aspect-ratio:1/1;max-width:100%;border-radius:14px;display:grid;place-items:center;background:radial-gradient(70% 60% at 50% 40%,#1b1f29,#0b0c11)}
.designer .prev svg{width:80%}
.designer .prev img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.colors{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.colors label{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
.colors input[type=color]{width:38px;height:38px;padding:0;border:1px solid var(--line2);border-radius:10px;background:none;cursor:pointer}
.actions{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{font-size:12px;color:var(--mut)}
.msg.err{color:var(--red)}
.msg.ok{color:var(--acc)}
.hint{color:var(--dim);font-size:12px}

/* ficha */
.ov{position:fixed;inset:0;z-index:20;background:rgba(3,4,6,.8);backdrop-filter:blur(6px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.sheet{position:relative;width:min(100%,900px);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);padding:0;overflow:hidden}
.sheet .stage{aspect-ratio:auto;min-height:100%}
.sheet .stage .flip{width:64%;cursor:pointer}
.flip-hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;color:var(--dim);font-size:12px}
.sheet .body{padding:26px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet h3{margin:0;font:700 28px/1.05 var(--disp);letter-spacing:-.03em;overflow-wrap:anywhere;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet h3 .crest{width:36px;height:36px}
.who{display:flex;align-items:center;gap:8px;font-size:15px}
.who .lbl{margin-right:4px}
.fill{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:18px;border:1px solid var(--acc-line);background:var(--acc-soft)}
.fill-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fill .row2{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fill .row2 .inp{flex:1;min-width:8rem}
.navrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.close{position:absolute;right:14px;top:14px;z-index:2}
.foot{color:var(--dim);font-size:12px;max-width:80ch}
.local{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:16px;border:1px dashed var(--acc-line);background:var(--acc-soft);color:var(--ice);font-size:13px}
.local div{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .card{padding:20px}.card.flush .card-h{padding:20px 20px 16px}.rack-card{padding:20px 0 0}.rack-card .card-h{padding:0 20px}
  .tools{padding:0 20px 16px}.grid{padding:0 20px 20px}.group{padding-left:20px;padding-right:20px}.rack-cap{padding-left:20px;padding-right:20px}
  .tab{padding:10px 4px;font-size:12px;gap:6px}.q{margin-left:0;width:100%}
  form.f{grid-template-columns:1fr}.designer{grid-template-columns:110px minmax(0,1fr)}
  .sheet{grid-template-columns:1fr}.sheet .stage{aspect-ratio:4/3}.sheet .body{padding:20px}
}
@media (max-width:480px){.stat:last-child{grid-column:1/-1}.hang{width:100px;margin-right:-56px}.hang .flip{width:100px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:14px}.tab svg{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.piece .info{padding:10px 11px 12px}.club b{font-size:13.5px}.designer{grid-template-columns:1fr}.designer .prev{width:140px}.prog{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 64 64" width="26" height="26"><path d="M23 13 L14 17 L6 26 L12.5 34 L18 30.5 L18 52 L46 52 L46 30.5 L51.5 34 L58 26 L50 17 L41 13 Q32 21 23 13 Z" fill="currentColor"/></svg></div>
    <div class="brand">Museo del CM</div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Secciones">
    <button class="tab" role="tab" id="t-vitrina" data-tab="vitrina" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M8 3 4 5 2 9l3 2 1-1v11h12V10l1 1 3-2-2-4-4-2c-1 2-2.5 3-4 3S9 5 8 3z"/></svg>Vitrina</button>
    <button class="tab" role="tab" id="t-estadisticas" data-tab="estadisticas" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Estadísticas</button>
    <button class="tab" role="tab" id="t-nueva" data-tab="nueva" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nueva camiseta</button>
  </nav>
  <main>
    <section class="panel" id="p-vitrina" role="tabpanel" aria-labelledby="t-vitrina"></section>
    <section class="panel" id="p-estadisticas" role="tabpanel" aria-labelledby="t-estadisticas" hidden></section>
    <section class="panel" id="p-nueva" role="tabpanel" aria-labelledby="t-nueva" hidden></section>
  </main>
  <div class="local" id="local" hidden></div>
  <p class="foot">Cada camiseta tiene su número según el orden en que llegó al museo. Escudos: TheSportsDB.</p>
</div>
<div class="ov" id="ov" hidden></div>

<script>
(function(){
  var TABS=['vitrina','estadisticas','nueva'];

    var acts=el('div','actions');var save=el('button','btn',ed?'Guardar cambios':'Sumar al museo');save.type='submit';
    var cancel=el('button','btn ghost','Cancelar');cancel.type='button';cancel.addEventListener('click',function(){st.editing=null;go('vitrina')});
    var msg=el('span','msg');add(acts,save,cancel,msg);
    add(f,fld('Club o selección',equipo,false,'f-equipo'),fld('Tipo',seg(['Club','Selección'],v.tipo,function(x){v.tipo=x||'Club'})),
      fld('País del club',pais,false,'f-pais'),fld('Año',anio,false,'f-anio'),
      fld('Jugador que la regaló',jug,false,'f-jugador'),fld('Nacionalidad del jugador',nac,false,'f-nac'),
      fld('Versión',seg(VERSIONES,v.version,function(x){v.version=x}),true),
      fld('¿Tiene número?',nr),fld('¿Tiene parches?',prr),fld('Orden de llegada',ord,true,'f-orden'),des,fld('Notas',notas,true,'f-notas'),acts);
    f.addEventListener('submit',function(e){
      e.preventDefault();msg.className='msg';
      if(!equipo.value.trim()){msg.className='msg err';msg.textContent='Falta el club o la selección.';equipo.focus();return}
      if(!jug.value.trim()){msg.className='msg err';msg.textContent='Falta el jugador que te la regaló.';jug.focus();return}
      if(!col){msg.className='msg err';msg.textContent='Todavía se están cargando las camisetas.';return}
      save.disabled=true;msg.textContent='Guardando…';
      var maxC=DATA.reduce(function(m,x){return Math.max(m,x.creado||0)},0);
      var d={equipo:equipo.value.trim(),tipo:v.tipo,pais:pais.value.trim(),temporada:anio.value.trim(),version:v.version||'',tieneNumero:v.tieneNumero,dorsal:v.tieneNumero?dor.value.trim():'',tieneParches:v.tieneParches,parches:v.tieneParches?par.value.trim():'',
        regaloDe:jug.value.trim(),nacionalidad:nac.value.trim(),color1:c1.value,color2:c2.value,patron:v.patron,escudo:escFor(),notas:notas.value.trim(),
        fotoId:ed&&!v.quitarFoto?(ed.fotoId||''):'',fotoUrl:ed&&!v.quitarFoto?(ed.fotoUrl||''):'',creado:creadoAfter(ord.value,ed?ed.id:null),editado:Date.now()};
      if(ed&&ed.diseno)d.diseno=ed.diseno;
      var up=Promise.resolve();
      up.then(function(){var id=ed?ed.id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);return col.doc(id).set(d).then(function(){return id})})
        .then(function(id){st.editing=null;go('vitrina');setTimeout(function(){openSheet(id)},250)})
        .catch(function(err){save.disabled=false;msg.className='msg err';msg.textContent=(err&&err.code==='too_large')?'La foto es muy pesada. Probá con otra.':'No se pudo guardar. Revisá la conexión y probá de nuevo.'});
    });
    add(c,f);add(root,c);
  }
  function shrink(file){return new Promise(function(res){if(!/^image\/(jpeg|png|webp)/.test(file.type)){res(file);return}var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){var M=1600,w=img.naturalWidth,h=img.naturalHeight,k=Math.min(1,M/Math.max(w,h));if(k===1&&file.size<2.5e6){URL.revokeObjectURL(u);res(file);return}var cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(u);cv.toBlob(function(b){res(b||file)},'image/jpeg',.86)};
    img.onerror=function(){URL.revokeObjectURL(u);res(file)};img.src=u})}

  /* ---- navegación ---- */
  function render(){renderVitrina();renderStats();if(st.tab!=='nueva')renderNueva()}
  function go(tab){if(TABS.indexOf(tab)<0)tab='vitrina';st.tab=tab;if(tab==='nueva')renderNueva();
    TABS.forEach(function(t){var on=t===tab;document.getElementById('p-'+t).hidden=!on;document.getElementById('t-'+t).setAttribute('aria-selected',String(on))});
    try{history.replaceState(null,'','#'+tab)}catch(e){}window.scrollTo(0,0)}
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){b.addEventListener('click',function(){if(b.dataset.tab==='nueva')st.editing=null;go(b.dataset.tab)})});
  window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h!==st.tab&&TABS.indexOf(h)>=0)go(h)});
  render();var h0=(location.hash||'').slice(1);go(TABS.indexOf(h0)>=0?h0:'vitrina');

  /* ---- datos: museo.json + cambios guardados en este navegador ---- */
  var LSK='museo-cm:cambios';
  function readLocal(){try{var v=JSON.parse(localStorage.getItem(LSK)||'null');if(v&&typeof v==='object')return {patch:v.patch||{},nuevas:v.nuevas||{},borradas:v.borradas||[]}}catch(e){}return {patch:{},nuevas:{},borradas:[]}}
  var LOCAL=readLocal();
  function writeLocal(){try{localStorage.setItem(LSK,JSON.stringify(LOCAL));return true}catch(e){return false}}
  function merge(){
    var out=[];
    BASE.forEach(function(b){if(LOCAL.borradas.indexOf(b.id)>=0)return;out.push(Object.assign({},b,LOCAL.patch[b.id]||{}))});
    Object.keys(LOCAL.nuevas).forEach(function(id){if(LOCAL.borradas.indexOf(id)>=0)return;out.push(Object.assign({},LOCAL.nuevas[id],LOCAL.patch[id]||{},{id:id}))});
    DATA=out.filter(function(x){return x.equipo});
  }
  function refresh(){merge();localBar();if(ov.hidden)render();else{renderVitrina();renderStats()}}
  function isBase(id){return BASE.some(function(b){return b.id===id})}
  function done(ok){refresh();return ok?Promise.resolve():Promise.reject({code:'storage'})}
  col={doc:function(id){return{
    update:function(p){LOCAL.patch[id]=Object.assign({},LOCAL.patch[id]||{},p);return done(writeLocal())},
    set:function(d){if(isBase(id))LOCAL.patch[id]=Object.assign({},d);else LOCAL.nuevas[id]=Object.assign({},d);return done(writeLocal())},
    'delete':function(){if(LOCAL.borradas.indexOf(id)<0)LOCAL.borradas.push(id);delete LOCAL.nuevas[id];delete LOCAL.patch[id];if(!isBase(id))LOCAL.borradas=LOCAL.borradas.filter(function(x){return x!==id});return done(writeLocal())}
  }}};
  function nCambios(){return Object.keys(LOCAL.patch).length+Object.keys(LOCAL.nuevas).length+LOCAL.borradas.length}
  function localBar(){
    var bar=document.getElementById('local');bar.textContent='';var n=nCambios();
    if(!n){bar.hidden=true;return}
    bar.hidden=false;
    add(bar,el('span',null,n+(n===1?' camiseta cambiada':' camisetas cambiadas')+' en este navegador. Descargá el respaldo y pasámelo para dejarlo fijo en el museo.'));
    var d=el('div');var b=el('button','btn','Descargar respaldo');b.type='button';
    b.addEventListener('click',function(){var data=numbered().map(function(x){var o={};Object.keys(x).forEach(function(k){if(k.charAt(0)!=='_')o[k]=x[k]});return o});
      var blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);
      a.download='museo-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)});
    add(d,b);add(bar,d);
  }
  fetch('museo.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){BASE=Array.isArray(j)?j:[]}).catch(function(){BASE=[]}).then(function(){st.loaded=true;refresh();if(st.tab==='nueva')renderNueva()});
})();
</script>
