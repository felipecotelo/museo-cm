<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo · Museo del CM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080b;color:#fafafa;font-family:Inter,sans-serif;display:grid;place-items:center;min-height:100vh}
.wrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;padding:24px}
.card{width:360px;border-radius:24px;border:1px solid #22262f;background:radial-gradient(70% 60% at 50% 40%,#1b1f29,#0b0c11);padding:18px;display:flex;flex-direction:column;align-items:center;gap:8px}
.card svg{width:100%;height:auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.6))}
.lbl{font:600 10px Inter;letter-spacing:.18em;text-transform:uppercase;color:#6b707c}
</style></head><body>
<div class="wrap">
<div class="card"><div class="lbl">Frente</div>
<svg viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <path id="cuerpo" d="M160 36 C140 42 112 50 92 58 C70 80 52 116 36 156 L84 186 C96 166 108 150 120 140 C122 220 121 320 116 412 C170 422 230 422 284 412 C279 320 278 220 280 140 C292 150 304 166 316 186 L364 156 C348 116 330 80 308 58 C288 50 260 42 240 36 C226 66 174 66 160 36 Z"/>
  <clipPath id="cc"><use href="#cuerpo"/></clipPath>
  <pattern id="ribs" width="5" height="10" patternUnits="userSpaceOnUse"><rect width="1.2" height="10" fill="rgba(255,255,255,.07)"/></pattern>
  <linearGradient id="luz" x1="0" y1="0" x2="1" y2=".2"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".28"/></linearGradient>
  <linearGradient id="bajo" x1="0" y1="0" x2="0" y2="1"><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
  <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="blanco" color-interpolation-filters="sRGB"><feFlood flood-color="#ffffff"/><feComposite in2="SourceAlpha" operator="in"/></filter>
 </defs>
 <use href="#cuerpo" fill="#86bfe9"/>
 <g clip-path="url(#cc)">
  <rect width="400" height="440" fill="url(#ribs)"/>
  <!-- costados negros con vivo blanco -->
  <path d="M120 140 C130 150 131 220 129 300 C128 360 128 392 127 416 L110 416 C118 320 120 220 116 136 Z" fill="#111318"/>
  <path d="M129.5 156 C131 222 130 300 129 360 C128.5 390 128.5 404 128 416" fill="none" stroke="#fff" stroke-width="2.2"/>
  <path d="M280 140 C270 150 269 220 271 300 C272 360 272 392 273 416 L290 416 C282 320 280 220 284 136 Z" fill="#111318"/>
  <path d="M270.5 156 C269 222 270 300 271 360 C271.5 390 271.5 404 272 416" fill="none" stroke="#fff" stroke-width="2.2"/>
  <!-- puños -->
  <path d="M30 152 L86 190 L93 177 L39 140 Z" fill="#ffffff"/>
  <path d="M370 152 L314 190 L307 177 L361 140 Z" fill="#ffffff"/>
  <!-- costuras de hombro -->
  <path d="M120 140 C111 112 101 84 92 58" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.6"/>
  <path d="M280 140 C289 112 299 84 308 58" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.6"/>
  <!-- pliegues -->
  <path d="M156 300 C192 286 228 292 256 322" stroke="#000" stroke-opacity=".08" stroke-width="12" fill="none" filter="url(#blur)"/>
  <path d="M160 210 C200 200 240 214 260 240" stroke="#fff" stroke-opacity=".12" stroke-width="14" fill="none" filter="url(#blur)"/>
  
  <rect width="400" height="440" fill="url(#luz)"/>
  <rect width="400" height="440" fill="url(#bajo)"/>
 </g>
 <!-- interior del cuello (espalda negra) y ribete -->
 <path d="M162 34 C178 60 222 60 238 34 C222 44 178 44 162 34 Z" fill="#111318"/>
 <path d="M156 33 C172 74 228 74 244 33 L236 30 C222 62 178 62 164 30 Z" fill="#ffffff"/>
 <path d="M164 30 C178 62 222 62 236 30" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="1"/>
 <use href="#cuerpo" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1.4"/>
 <!-- logos -->
 <image href="../marcas/nike.svg" x="128" y="112" width="44" height="18" filter="url(#blanco)" preserveAspectRatio="xMidYMid meet"/>
 <image href="../escudos/uruguay.png" x="222" y="88" width="46" height="52" preserveAspectRatio="xMidYMid meet"/>
 <text x="200" y="212" text-anchor="middle" font-family="Teko" font-weight="600" font-size="46" fill="#111318">9</text>
</svg></div>

<div class="card"><div class="lbl">Espalda</div>
<svg viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <path id="cuerpoB" d="M160 36 C140 42 112 50 92 58 C70 80 52 116 36 156 L84 186 C96 166 108 150 120 140 C122 220 121 320 116 412 C170 422 230 422 284 412 C279 320 278 220 280 140 C292 150 304 166 316 186 L364 156 C348 116 330 80 308 58 C288 50 260 42 240 36 C226 46 174 46 160 36 Z"/>
  <clipPath id="ccB"><use href="#cuerpoB"/></clipPath>
  <pattern id="ribsB" width="5" height="10" patternUnits="userSpaceOnUse"><rect width="1.2" height="10" fill="rgba(255,255,255,.07)"/></pattern>
  <linearGradient id="luzB" x1="1" y1="0" x2="0" y2=".2"><stop offset="0" stop-color="#fff" stop-opacity=".14"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset=".72" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".26"/></linearGradient>
  <filter id="blurB" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
 </defs>
 <use href="#cuerpoB" fill="#86bfe9"/>
 <g clip-path="url(#ccB)">
  <rect width="400" height="440" fill="url(#ribsB)"/>
  <path d="M120 140 C130 150 131 220 129 300 C128 360 128 392 127 416 L110 416 C118 320 120 220 116 136 Z" fill="#111318"/>
  <path d="M129.5 156 C131 222 130 300 129 360 C128.5 390 128.5 404 128 416" fill="none" stroke="#fff" stroke-width="2.2"/>
  <path d="M280 140 C270 150 269 220 271 300 C272 360 272 392 273 416 L290 416 C282 320 280 220 284 136 Z" fill="#111318"/>
  <path d="M270.5 156 C269 222 270 300 271 360 C271.5 390 271.5 404 272 416" fill="none" stroke="#fff" stroke-width="2.2"/>
  <path d="M30 152 L86 190 L93 177 L39 140 Z" fill="#ffffff"/>
  <path d="M370 152 L314 190 L307 177 L361 140 Z" fill="#ffffff"/>
  <path d="M120 140 C111 112 101 84 92 58" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.6"/>
  <path d="M280 140 C289 112 299 84 308 58" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="1.6"/>
  
  <rect width="400" height="440" fill="url(#luzB)"/>
 </g>
 <!-- cuello de espalda: blanco y negro -->
 <path d="M156 33 C176 50 224 50 244 33 L236 30 C220 42 180 42 164 30 Z" fill="#ffffff"/>
 <path d="M200 46.5 C214 45.8 226 42 236 30 L244 33 C232 45 216 51 200 51.5 Z" fill="#111318"/>
 <use href="#cuerpoB" fill="none" stroke="rgba(0,0,0,.45)" stroke-width="1.4"/>
 <!-- sol y estrellas -->
 <g fill="#111318" stroke="#111318">
  <g stroke-width="1.6" id="sol"></g>
  <circle cx="200" cy="80" r="4"/>
 </g>
 <script>/* rayos del sol y estrellas */</script>
 <text x="200" y="152" text-anchor="middle" font-family="Teko" font-weight="600" font-size="40" letter-spacing="1" fill="#111318">L. SUÁREZ</text>
 <text x="200" y="318" text-anchor="middle" font-family="Teko" font-weight="600" font-size="178" fill="#111318">9</text>
</svg></div>
</div>
<script>
// rayos del sol y 4 estrellas, a mano en coordenadas
var ns='http://www.w3.org/2000/svg',g=document.getElementById('sol');
for(var a=0;a<16;a++){var an=a*Math.PI/8,r1=a%2?8:10.5,l=document.createElementNS(ns,'line');l.setAttribute('x1',200+Math.cos(an)*5.5);l.setAttribute('y1',80+Math.sin(an)*5.5);l.setAttribute('x2',200+Math.cos(an)*r1);l.setAttribute('y2',80+Math.sin(an)*r1);g.appendChild(l)}
[168,180,220,232].forEach(function(x){var p=document.createElementNS(ns,'path'),pts=[];for(var i=0;i<10;i++){var rr=i%2?1.7:4,aa=-Math.PI/2+i*Math.PI/5;pts.push((x+Math.cos(aa)*rr).toFixed(2)+','+(80+Math.sin(aa)*rr).toFixed(2))}p.setAttribute('d','M'+pts.join(' L')+' Z');p.setAttribute('stroke','none');g.parentNode.appendChild(p)});
</script>
</body></html>
